name: 每天抓价并发布

# 为什么放在 GitHub Actions 而不是本机的 launchd：
#   本机那套只在「Mac 开着、你还登录着」时才跑，出差一周就断档。
#   Actions 的 runner 是临时的，所以价格库（data/deals.db）必须进版本管理——
#   每次跑完把库提交回仓库，历史就攒在 git 里了（顺带成了带版本的异地备份）。
#   商品图与字体不进 git（168MB 会把仓库拖垮），走 Actions 的缓存。
#
# 需要一个一次性的设置：在仓库 Settings → Secrets 里加两个
#   CLOUDFLARE_API_TOKEN   权限：Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  在 Cloudflare 控制台右侧栏能抄到
# 没有这两个，抓价与生成报告照跑，只有最后推送到 Cloudflare 那一步会失败。

on:
  schedule:
    # 01:00 UTC = 北京时间 09:00：**主跑**——写价格历史、提交库、发提醒。
    # GitHub 的定时任务是尽力而为，高峰期可能晚几分钟到几十分钟，对主跑无所谓。
    - cron: '0 1 * * *'
    # 其余每小时一次，**只为把「剩余尺码」刷新的更勤**（用户 2026-10-05 要求 30~60 分钟）。
    # 起因：2026-10-01 对账发现 25% 的在榜商品尺码和实时对不上，而且是双向的
    # （补货变多、卖完变少）——3 小时还是太稀，热门款几小时就变（2026-10-05 又踩到）。
    # 同步一次很便宜（9 页、约 40 秒），而且同一天重复同步不会污染历史：
    # price_history 按「天」为主键，重跑只是覆盖当天那一行。所以「价格不用那么勤」也天然满足——
    # 尺码和价格在同一个接口响应里，要刷尺码就得连带拿到价格；但按天覆盖，不产生历史噪音，
    # 反而让报告里显示的价格更准。
    # 这几次不提交库（省 git 历史）、也不发提醒（省 Issue）。
    # 0,2-23 即「除 1 点之外的每小时」：避免和上面那条主跑在 1 点撞车、同一分钟双跑。
    - cron: '0 0,2-23 * * *'
  workflow_dispatch: # 也能在网页上点一下立刻跑

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write # 把价格库提交回去
  issues: write # 有提醒时开一个 Issue

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 装依赖
        run: npm ci

      # 商品图 / 字体：能缓存就缓存，缓存没命中就现下（ensureImages 只补缺的）
      - name: 取回素材缓存
        id: assets
        uses: actions/cache@v4
        with:
          path: |
            reports/uniqlo/img
            reports/uniqlo/img
            data/fonts
          key: assets-${{ github.run_id }}
          restore-keys: assets-

      - name: 跑测试
        # 那些「光看代码看不出对错」的规则（下架判定、谢绝名单、payload 契约、尺码映射）
        # 都在 test/ 里，零依赖。挂了就早失败，别把坏数据推上线。
        run: npm test

      - name: 市集接口冒烟（真 D1，会自己起 wrangler）
        # 单测里的 D1 是手写的假货、SQL 根本不执行 —— 2026-10-01 线上发帖 500 挂了几个小时，
        # 而当时 43 条单测全绿。只有这一步能挡住「列数和占位符对不上」这类错。
        # 它只碰自己建的那几条数据，跑完自己删；新环境会先按 market/schema.sql 建表。
        run: node scripts/market-smoke.mjs

      - name: 抓价写库
        run: node src/cli.mjs all sync

      - name: 生成两份报告
        # 报告里显示的是本地缓存的图，所以这一步会把缺的图下下来（首次约 168MB）
        run: node src/cli.mjs all report --no-open

      - name: 推到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 没配 Secret 时跳过部署，而不是让整轮失败——这样点一次「Run workflow」
          # 就能先验证「抓取 + 生成报告」通不通（那也是这套东西最大的未知数：
          # 优衣库前面挂着 EdgeOne 的 WAF，不知道它认不认 GitHub runner 的机房 IP）。
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::没配 CLOUDFLARE_API_TOKEN，跳过部署；抓价与生成报告已经跑完了。"
            exit 0
          fi
          node src/cli.mjs all deploy --target cloudflare

      - name: 把价格库提交回去
        # 这一步就是「备份」：git 里每次一条带日期的快照，比本机那份 VACUUM 快照更耐用。
        # 只在主跑（01:00 UTC）和手动触发时做：其余 7 次是刷尺码的，提交 8 遍 4MB 的
        # 二进制只会把 git 历史撑大，而后一次跑本来就从头同步一遍。
        if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "deals bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/deals.db
          if git diff --cached --quiet; then
            echo "价格库没有变化，不用提交"
          else
            git commit -m "价格快照 $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: 该提醒的开一个 Issue
        # 盯着的商品降价了、或者数据断档了。osascript 在 Linux 上本来就什么都不做，
        # 所以这里的通知渠道换成 Issue —— GitHub 会给仓库的 watch 邮箱发信。
        # 同样只在主跑与手动触发时做：不然一天会开 8 个 Issue。
        if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$(node src/cli.mjs alert || true)"
          echo "$out"
          if echo "$out" | grep -q '要提醒的'; then
            body="$(echo "$out" | sed -n '/要提醒的/,$p')"
            gh issue create \
              --title "提醒 $(date -u '+%Y-%m-%d')：$(echo "$out" | grep -c '^  ' ) 条" \
              --body "$body" || echo "开 Issue 失败（不影响抓价与发布）"
          fi

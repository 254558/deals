<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>GoodPrices · 惊鸿一瞥</title>
<!--
  惊鸿一瞥。

  为什么是手写的单页、不走报告那套 React 管线：报告要能双击打开（file://）、要单文件内联，
  这个页面反过来——它必须有后端（/api/*），也永远只在线上用。所以怎么简单怎么来：
  一个文件、原生 JS、零构建，改完直接部署。

  和报告共用同一套视觉语言：墨 #000f17、品牌蓝 #3643ba、发丝线 #d9dde1、全站直角。
-->
<!-- @shell -->
  <link rel="stylesheet" href="market.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
  <div class="masthead__eyebrow">
    <span class="masthead__dot"></span>
    <a class="masthead__text masthead__home" href="/" title="GoodPrices 首页（优衣库捡漏榜）">GoodPrices</a>
    <a class="masthead__text masthead__cross" href="/uniqlo/" target="_blank" rel="noreferrer">优衣库比价</a>
    <a class="masthead__text masthead__cross" href="/decathlon/" target="_blank" rel="noreferrer">迪卡侬比价</a>
  </div>
  </div>
</header>

<div class="wrap">

  <!-- 发帖表单：**底部弹层**（原来是一张内联卡，压在 feed 上面，进页面要先滚一下才看得见刷）
       2026-10-01 用户要「打开就是满屏刷」，于是把它改成弹层 + 一个悬浮按钮 -->
  <div class="card card--form" id="postCard">
    <div class="card__head">
      <!-- 顶部这个 2026-10-01 按用户要求换掉：「最顶部的我要出一件，换成和最下面的发布
           一样的返回按钮」。用同一个 .btn，所以上下看起来是一对。
           id 仍是 postClose（JS 里那个收起弹层的监听挂在它身上）。 -->
      <button class="btn" type="button" id="postClose">返回</button>
    </div>
    <div class="card__body" id="postBody">
    <form id="form" autocomplete="off">
      <div class="poster">
        <!-- 照片也是一个「字段」：**有标签**，标签和右边「商品名」并排，
             框于是正好和「商品名」下面那个输入框的上边框对齐（之前照片没标签，
             它跟的是对方的标签，看着就是错位的）。
             原生 file 输入藏在框里，看得见的是这块虚线区 -->
        <div class="field field--photo">
          
          <div class="photo" id="photoBox">
            <input type="file" id="photo" accept="image/*">
            <label class="photo__pick" for="photo" id="pick">
              <span class="photo__icon">＋</span>
              <span class="photo__text">选择照片</span>
            </label>
            <img id="previewImg" alt="预览" hidden>
            <button class="photo__swap" type="button" id="swap" hidden>换一张</button>
          </div>
        </div>

        <div class="fields">
          <div class="field field--full">
            <label for="title">商品名</label>
            <input type="text" id="title" maxlength="60" placeholder="如：羊毛混纺大衣 米白">
          </div>
          <div class="field">
            <label for="price">价格（元）</label>
            <input type="number" id="price" min="0" step="1" placeholder="如：299">
          </div>
          <!-- 尺码与联系方式这两个字段 2026-10-01 按用户要求去掉：
               表单只留 图片 / 商品名 / 详情，其余（尺码、联系方式…）都写进详情里。
               老帖子里的这两个字段仍然照常显示。 -->
          <div class="field field--full">
            <label for="note">说明</label>
            <textarea id="note" maxlength="240" placeholder="包邮还是到付、有没有瑕疵、吊牌还在不在…"></textarea>
          </div>
        </div>

        <div class="submit-row">
          <button class="btn" type="submit" id="submit">发布</button>
          <button class="btn btn--ghost" type="button" id="cancelEdit" hidden>取消编辑</button>
          <div class="msg" id="msg"></div>
        </div>
      </div>

      <div class="hp"><label for="website">网址</label><input type="text" id="website" tabindex="-1"></div>

    </form>
    </div><!-- /.card__body -->
  </div>

  <h2 id="listTitle">上下滑着看</h2>
  <!-- 小红书那种：两列瀑布流封面，点开看详情 -->
  <div id="list" class="wall"></div>
  <div id="detail" class="detail" hidden></div>

  <!-- 悬浮的发帖入口：feed 占满屏之后就靠它开弹层 -->
  <button class="fab" type="button" id="postToggle" aria-expanded="false" aria-controls="postBody">
    <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>我要出一件
  </button>
  <div id="loading" class="empty">正在加载…</div>
  <div id="empty" class="empty" style="display:none">还没有人发。你要是在店里捡到漏，上面发一件试试。</div>

  <footer>
    <b>这里只是把东西摆出来，交易是你和买家之间的事。</b>
    <ol>
      <li>本站不经手钱、不担保、不介入纠纷。建议走闲鱼/微信的担保交易，或者当面交易。</li>
      <li>照片请自己拍。用官网图、盗别人的图，被举报就下架。</li>
      <li>不要发违禁品、假货、需要资质才能卖的东西。</li>
      <li>联系方式是公开的，介意就别填太细（比如只留微信号）。</li>
      <li>被举报 5 次会自动下架，等站长回看。</li>
    </ol>
  </footer>
</div>

  <script defer src="market.js"></script>
</body>
</html>

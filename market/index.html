<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>GoodPrices · 测评</title>
<!--
  测评。

  2026-10-06：这一页原来是「有品」市集（卖二手杂物）。用户把它换成了测评：
  「大家可以分享自己在优衣库买的具体的衣服的测评，心得，值不值」。

  和市集的根本区别：**测评绑在一件优衣库商品上**（?productCode=…）。
  所以这个页面的入口不在导航里，而在**报告卡片**上 —— 你在榜单上看到一件，
  点「写测评 / N 条测评」就带着那件商品过来。这样两个功能共享同一个对象，
  而不是各说各话（市集卖的东西和榜单毫无关系，那才是它一直没人的原因）。

  字段只有三个：哪件商品 + 心得 + 可选的一张图。评分、尺码、身高体重都问过用户，
  他都不要（「就可以发图片，发心得」「连尺码也不要」）。

  为什么是手写的单页、不走报告那套 React 管线：报告要能双击打开（file://）、要单文件内联，
  这个页面反过来 —— 它必须有后端（/api/*），也永远只在线上用。所以怎么简单怎么来：
  一个文件、原生 JS、零构建、零依赖。

  和报告共用同一套视觉语言：墨 #000f17、品牌蓝 #3643ba、发丝线 #d9dde1、全站直角。
-->
<!-- @shell -->
  <link rel="stylesheet" href="market.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
  <div class="masthead__eyebrow">
    <span class="masthead__dot"></span>
    <a class="masthead__text masthead__home" href="/" title="GoodPrices 首页（优衣库捡漏榜）">GoodPrices</a>
    <a class="masthead__text masthead__cross" href="/uniqlo/" target="_blank" rel="noreferrer">优衣库比价</a>
    <!-- 「我的」放在最右边（用户 2026-10-01：「我的，放到最右边」）——
         它跟前面那两条不一样：那两条是去看别人整理的榜，这条是进自己的地盘。 -->
    <a class="masthead__text masthead__cross" href="?mine=1" id="navMine">我的</a>
  </div>
  </div>
</header>

<div class="wrap">

  <!-- 写测评：**只有带着商品进来时才打开**（入口在报告卡片上）。
       单独点进来时这个按钮不显示 —— 因为「给哪件写」这个问题没有答案。 -->
  <div class="card card--form" id="postCard">
    <div class="card__head">
      <button class="btn" type="button" id="postClose">返回</button>
    </div>
    <div class="card__body" id="postBody">
    <form id="form" autocomplete="off">
      <!-- 评的是哪件：**搜优衣库全站**，不限于榜单。
           2026-10-06 用户纠正：「不一定非要去榜单上找一件你用过的，他可以测评任何优衣库的东西」。
           榜单只有几百件打折的，优衣库在售的有几万件 —— 所以这里给一个通用搜索
           （走后端代理 /api/search，浏览器直连优衣库会被 CORS 挡）。 -->
      <div class="field field--full">
        <label for="psearch">评的是哪件</label>
        <input type="search" id="psearch" placeholder="搜商品名或吊牌号，比如「抽褶裙」或 488089" autocomplete="off">
        <div class="presults" id="presults" hidden></div>
      </div>
      <p class="subject" id="subject" hidden></p>

      <div class="field field--full">
        <label for="body">心得</label>
        <textarea id="body" maxlength="500" placeholder="穿了多久、面料手感、值不值这个价…"></textarea>
      </div>

      <div class="field field--photo">
        <div class="photo" id="photoBox">
          <input type="file" id="photo" accept="image/*">
          <label class="photo__pick" for="photo" id="pick">
            <span class="photo__icon">＋</span>
            <span class="photo__text">加张实拍（可选）</span>
          </label>
          <img id="previewImg" alt="预览" hidden>
          <button class="photo__swap" type="button" id="swap" hidden>换一张</button>
        </div>
      </div>

      <div class="submit-row">
        <button class="btn" type="submit" id="submit">发布</button>
        <div class="msg" id="msg"></div>
      </div>

      <div class="hp"><label for="website">网址</label><input type="text" id="website" tabindex="-1"></div>
    </form>
    </div><!-- /.card__body -->
  </div>

  <button class="btn" type="button" id="postToggle" aria-expanded="false" aria-controls="postBody">写测评</button>

  <!-- 抖音式 tab 条（用户 2026-10-05 要的样式）。只在「我的」页显示。 -->
  <div class="mine-tabs" id="mineTabs" role="tablist" hidden>
    <button class="mine-tab mine-tab--on" type="button" role="tab" aria-selected="true" data-tab="favs">收藏</button>
    <button class="mine-tab" type="button" role="tab" aria-selected="false" data-tab="works">我的测评</button>
    <button class="mine-tab" type="button" role="tab" aria-selected="false" data-tab="transfer">转移码</button>
  </div>

  <!-- 测评流（公开页 = 最新一批；「我的」页 = 我写过的） -->
  <div class="mine-pane" id="paneWorks">
    <div id="list" class="reviews"></div>
    <div id="loading" class="empty">正在加载…</div>
    <div id="empty" class="empty" style="display:none"></div>
  </div>

  <!-- 转移码 -->
  <div class="mine-pane" id="paneTransfer" hidden>
    <div class="transfer" id="transfer">
      <div class="transfer__row">
        <button class="btn btn--ghost btn--sm" type="button" id="exportBtn">转到别的设备</button>
        <button class="btn btn--ghost btn--sm" type="button" id="importBtn">从别的设备导入</button>
      </div>
      <p class="hint" id="transferHint">换手机、清了缓存，「我的」就会空。用上面这两颗按钮把凭据搬过去。</p>
      <textarea id="transferCode" rows="3" spellcheck="false" placeholder="（点「从别的设备导入」之后，把码粘在这里）"></textarea>
      <div class="transfer__row">
        <button class="btn btn--sm" type="button" id="copyCode" hidden>复制</button>
        <button class="btn btn--sm" type="button" id="importGo" hidden>导入</button>
      </div>
    </div>
  </div>

  <!-- 收藏：报告页点过爱心的，快照存在 localStorage -->
  <div class="mine-pane" id="paneFavs" hidden>
    <section class="favs" id="favs" hidden>
      <h2 class="favs__title">收藏夹</h2>
      <div class="favs__list" id="favsList"></div>
    </section>
    <p class="favs__empty" id="favsEmpty" hidden>还没收藏。去 <a href="/uniqlo/" target="_blank" rel="noreferrer">优衣库</a> 点商品卡片上的爱心，这里就会列出来。</p>
  </div>

</div>

  <script defer src="market.js"></script>
</body>
</html>
